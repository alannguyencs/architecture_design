<!doctype html>
<html lang="en">
<head>

<!-- Book-figure template: System Design Interview figure 14-4 (design YouTube, video
     uploading flow) redrawn in the ByteByteGo animated look. Canvas 1200 × 1480 CSS px.
     Shared icons are animated by wrapping their <use> in a <g> that carries the .a-* class
     (an animation inside the <use> itself cannot be seeked by render_gif.py). -->
<link rel="stylesheet" href="../assets/bbg-animated.css">
<link rel="stylesheet" href="../assets/bbg-parts.css">
<style>
  .canvas { width: 1200px; height: 1480px; }
  .svc { font-size: 21px; }

</style>
</head>
<body>
<div class="canvas">
<script src="../assets/bbg-icons.js"></script>

<div class="title" style="left:27px; top:57px; font-size:35px;">How Video</div>
<div class="title-pill" style="left:232px; top:38px; width:388px; height:70px; font-size:37px;">Uploading Works?</div>
<div class="rule" style="left:10px; top:145px; width:1180px;"></div>

<!-- ===== Flow lines (under the icons) ===== -->
<svg class="layer edges" width="1200" height="1480" viewBox="0 0 1200 1480">
  <path d="M520 255 H202" marker-end="url(#m-tri)"/>                               <!-- 1 user → original storage -->
  <path d="M700 315 V378" marker-end="url(#m-tri)"/>                               <!-- user → LB (metadata) -->
  <path d="M700 478 V522" marker-end="url(#m-tri)"/>                               <!-- LB → API servers -->
  <path d="M650 636 C626 680 590 700 572 740" marker-end="url(#m-tri)"/>           <!-- API → metadata cache -->
  <path d="M750 636 C774 680 810 700 828 740" marker-end="url(#m-tri)"/>           <!-- API → metadata DB -->
  <path d="M140 352 V1004" marker-end="url(#m-tri)"/>                              <!-- 2 original storage → transcoding -->
  <path d="M342 1070 H542" marker-end="url(#m-tri)"/>                              <!-- 3b transcoding → completion queue -->
  <path d="M726 1070 H852" marker-end="url(#m-tri)"/>                              <!-- 3b.1 queue → completion handler -->
  <path d="M1010 1004 C1010 930 900 900 852 840" marker-end="url(#m-tri)"/>        <!-- handler → metadata DB -->
  <path d="M950 1004 C900 920 640 930 580 840" marker-end="url(#m-tri)"/>          <!-- handler → metadata cache -->
  <path d="M140 1136 V1276" marker-end="url(#m-tri)"/>                             <!-- 3a transcoding → transcoded storage -->
  <path d="M198 1335 H414" marker-end="url(#m-tri)"/>                              <!-- 3a.1 transcoded storage → CDN -->
</svg>

<!-- ===== User (TV, laptop, phone) ===== -->
<div class="svc server" style="left:520px; top:195px; width:360px; height:120px;">
  <span>User</span>
  <svg width="64" height="64"><g class="anim a-bob"><use href="#tv" width="64" height="64"/></g></svg>
  <svg width="64" height="64"><g class="anim a-bob" style="animation-delay:-0.37s"><use href="#laptop" width="64" height="64"/></g></svg>
  <svg width="64" height="64"><g class="anim a-bob" style="animation-delay:-0.75s"><use href="#phone" width="64" height="64"/></g></svg>
</div>

<!-- ===== Original storage (bucket) ===== -->
<svg class="icon" style="left:140px; top:255px;" width="110" height="112"><use href="#bucket"/></svg>
<div class="t c" style="left:140px; top:318px;">Original Storage</div>
<div class="step" style="left:362px; top:255px;">1</div>

<!-- ===== Load balancer (nodes light up in turn; inline so each circle can animate) ===== -->
<svg class="icon" style="left:700px; top:428px;" width="90" height="90" viewBox="0 0 90 90">
  <path d="M45 28 V48 M14 64 V48 H76 V64 M45 48 V64" fill="none" stroke="#111" stroke-width="3.5"/>
  <circle class="a-light" cx="45" cy="16" r="12" stroke="#111" stroke-width="3.5"/>
  <circle class="a-light" cx="14" cy="75" r="11" stroke="#111" stroke-width="3.5" style="animation-delay:-1.69s"/>
  <circle class="a-light" cx="45" cy="75" r="11" stroke="#111" stroke-width="3.5" style="animation-delay:-1.12s"/>
  <circle class="a-light" cx="76" cy="75" r="11" stroke="#111" stroke-width="3.5" style="animation-delay:-0.56s"/>
</svg>
<div class="t" style="left:762px; top:412px;">Load Balancer</div>

<!-- ===== API servers ===== -->
<div class="svc api" style="left:560px; top:525px; width:280px; height:110px;">
  <span>API<br>Servers</span>
  <svg width="86" height="69"><use href="#cluster" width="86" height="69"/></svg>
</div>

<!-- ===== Metadata cache and DB ===== -->
<svg class="icon" style="left:560px; top:790px;" width="88" height="78"><use href="#redis"/></svg>
<div class="t" style="left:318px; top:772px;">Metadata Cache</div>
<svg class="icon" style="left:840px; top:790px;" width="90" height="84"><use href="#db-stack" style="--icon-fill:#bdff4a"/></svg>
<div class="t" style="left:900px; top:772px;">Metadata DB</div>

<!-- ===== Transcoding servers (spinner turns) ===== -->
<div class="step" style="left:140px; top:680px;">2</div>
<div class="svc status" style="left:40px; top:1008px; width:302px; height:124px;">
  <span>Transcoding<br>Servers</span>
  <svg width="80" height="80" viewBox="0 0 80 80">
    <circle cx="38" cy="40" r="30" fill="none" stroke="#111" stroke-width="3.5" stroke-dasharray="11 8"/>
    <g class="a-spin" style="transform-origin:38px 40px">
      <path d="M32 31 L48 40 L32 49 Z" fill="none" stroke="#111" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M59 61 L54 56" stroke="#111" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="62" cy="64" r="7" fill="#ffc04d" stroke="#111" stroke-width="3"/>
    </g>
  </svg>
</div>

<!-- ===== Completion queue (envelopes bob in turn) ===== -->
<div class="step lbl" style="left:440px; top:1070px;">3b</div>
<svg class="icon" style="left:636px; top:1070px;" width="174" height="86" viewBox="0 0 174 86">
  <path d="M3 3 H144 L171 43 L144 83 H3 Z" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
  <g class="a-bob">
    <rect x="16" y="27" width="35" height="31" rx="5" fill="#ffe763" stroke="#111" stroke-width="3"/><path d="M17 30 L33 44 L50 30" fill="none" stroke="#111" stroke-width="3"/>
  </g>
  <g class="a-bob" style="animation-delay:-0.37s">
    <rect x="61" y="27" width="35" height="31" rx="5" fill="#ffe763" stroke="#111" stroke-width="3"/><path d="M62 30 L78 44 L95 30" fill="none" stroke="#111" stroke-width="3"/>
  </g>
  <g class="a-bob" style="animation-delay:-0.75s">
    <rect x="106" y="27" width="35" height="31" rx="5" fill="#ffe763" stroke="#111" stroke-width="3"/><path d="M107 30 L123 44 L140 30" fill="none" stroke="#111" stroke-width="3"/>
  </g>
</svg>
<div class="t c" style="left:636px; top:1120px;">Completion Queue</div>

<!-- ===== Completion handler (gear turns) ===== -->
<div class="step lbl" style="left:794px; top:1070px;">3b.1</div>
<div class="svc server" style="left:858px; top:1008px; width:302px; height:124px;">
  <span>Completion<br>Handler</span>
  <svg width="72" height="72"><g class="anim a-spin"><use href="#worker" width="72" height="72"/></g></svg>
</div>

<!-- ===== Transcoded storage and CDN ===== -->
<div class="step lbl" style="left:140px; top:1206px;">3a</div>
<svg class="icon" style="left:140px; top:1335px;" width="110" height="112"><use href="#bucket" style="--icon-fill:#d6278b"/></svg>
<div class="t c" style="left:140px; top:1398px;">Transcoded Storage</div>
<div class="step lbl" style="left:306px; top:1335px;">3a.1</div>
<svg class="icon" style="left:480px; top:1335px;" width="120" height="81" viewBox="0 0 104 70">
  <rect x="8" y="8" width="88" height="54" fill="#fff" stroke="#111" stroke-width="3.5"/>
  <circle cx="8" cy="8" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="96" cy="8" r="6" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle class="a-light" cx="8" cy="62" r="6" stroke="#111" stroke-width="3" style="animation-delay:-0.6s"/>
  <circle class="a-light" cx="96" cy="62" r="6" stroke="#111" stroke-width="3"/>
  <text x="52" y="44" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="22" fill="#111">CDN</text>
</svg>

</div>
<script>
  // Streaks: a green copy of every flow line (pathLength 1000 makes the dash the same share
  // of every path); class="no-flow" skips one. Without data-step every streak runs over the
  // whole loop at once. Give edges data-step="1", "2", … and the loop is cut into one slot per
  // step: each streak runs only in its own slot, so the motion follows the story; edges with
  // the same step (parallel work) run together. Uses element.animate, which render_gif.py seeks.
  const loopMs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--loop')) * 1000;
  const edges = [...document.querySelectorAll('svg.edges > path:not(.no-flow)')];
  const steps = Math.max(0, ...edges.map(p => +p.dataset.step || 0));
  edges.forEach(p => {
    const f = p.cloneNode();
    ['marker-start', 'marker-end', 'data-step'].forEach(a => f.removeAttribute(a));
    f.setAttribute('class', 'flow'); f.setAttribute('pathLength', '1000');
    p.after(f);
    const step = +p.dataset.step;
    if (!steps || !step) return;
    const a = (step - 1) / steps, b = step / steps;
    f.style.animation = 'none';
    // Park the dash 110 units clear of both ends while it waits, so its round cap never
    // shows as a dot at the start or the end of the line.
    f.animate([{ offset: 0, strokeDashoffset: 110 }, { offset: a, strokeDashoffset: 110 },
               { offset: b, strokeDashoffset: -1110 }, { offset: 1, strokeDashoffset: -1110 }],
              { duration: loopMs, iterations: Infinity });
  });
</script>
<script src="../assets/bbg-parts.js"></script>
</body>
</html>
