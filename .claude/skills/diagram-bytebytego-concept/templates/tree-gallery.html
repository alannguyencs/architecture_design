<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tree Gallery</title>
<!-- One sample of each tree option, modelled on book figures: a plain trie with word nodes
     (autocomplete 13-5), a top-k lookup path (13-7), a quadtree with circle / square nodes,
     edge labels and a highlighted update path (proximity 14, 19), a folder tree (distributed
     email 4) and a short mind map (metrics 2). Render it to check the component:
     canvas 1280 × 1120. -->
<link rel="stylesheet" href="../assets/bbg-flow.css">
<link rel="stylesheet" href="../assets/bbg-parts.css">
<link rel="stylesheet" href="../assets/bbg-concept.css">
<style>
  .canvas { width: 1280px; height: 1120px; }
</style>
</head>
<body>
<div class="canvas">
<script src="../assets/bbg-icons.js"></script>
<div class="title" style="left:30px; top:28px; font-size:44px;">tree</div>
</div>
<script src="../assets/bbg-concept.js"></script>
<script>
  const w = label => ({ label, leaf: true });
  // Trie, with the top-k lookup path for prefix "tr" in blue.
  BBG.tree({
    x: 30, y: 110, size: 14, level: 70, gap: 14, arrows: true,
    root: { label: '', minW: 60, tag: 'root', children: [
      { label: 't', edge: { color: 'blue', bold: true }, children: [
        { label: 'tr', hl: true, edge: { color: 'blue', bold: true }, children: [
          { label: 'tre', children: [w('tree: 10')] }, { label: 'tru', children: [w('true: 35')] }, w('try: 29')] },
        { label: 'to', children: [w('toy: 14')] }] },
      { label: 'w', children: [{ label: 'wi', children: [{ label: 'wis', children: [w('wish: 25')] }, w('win: 50')] }] },
    ] },
  });

  // Quadtree: circles are internal nodes, squares leaves; the update path is pink.
  const q = (label, children, hot) => ({ label, kind: 'circle', cls: hot ? 'c-pink' : null, children,
                                         edge: hot ? { bold: true } : undefined });
  BBG.tree({
    x: 420, y: 560, size: 14, level: 78, gap: 16,
    root: { label: '200m', kind: 'circle', cls: 'c-pink', children: [
      { ...q('40m'), edge: { label: 'nw' } },
      { ...q('30m', [
        { ...q('12m'), edge: { label: 'nw' } },
        { ...q('4m', [
          { ...q('340', [
            { label: '50', kind: 'square' }, { label: '90', kind: 'square' },
            { label: '140', kind: 'circle', cls: 'c-pink', edge: { bold: true },
              children: [{ label: '60', kind: 'square' }, { label: '80', kind: 'square', cls: 'c-pink', edge: { bold: true } }] },
          ], true), edge: { dash: true, bold: true } },
        ], true), edge: { label: 'ne', bold: true } },
        { ...q('5m'), edge: { label: 'sw' } },
        { ...q('9m'), edge: { label: 'se' } },
      ], true), edge: { label: 'ne', bold: true } },
      { ...q('70m'), edge: { label: 'sw' } },
      { ...q('60m'), edge: { label: 'se' } },
    ] },
  });

  // Folder tree.
  const dir = (label, children) => ({ label, kind: 'folder', children });
  BBG.tree({
    x: 60, y: 560, mode: 'right', size: 16, gap: 10,
    root: dir('/', [dir('home', [
      dir('user1', [dir('Maildir', [dir('cur'), dir('new'), dir('tmp')])]),
      dir('user2', [dir('Maildir', [dir('cur'), dir('new'), dir('tmp')])]),
    ])]),
  });

  // Mind map.
  BBG.tree({
    x: 660, y: 150, mode: 'mind', size: 18, level: 50, gap: 22,
    root: { label: 'Metrics monitoring\nand alerting system', cls: 'c-green', children: [
      '1. Data collection', '2. Data transmission', '3. Data storage', '4. Alerting', '5. Visualization'] },
  });
</script>
<script src="../assets/bbg-parts.js"></script>
</body>
</html>
